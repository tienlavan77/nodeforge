# _nodeforge_created_file = true

# >>> nodeforge-mcp-begin (_managed_by: "nodeforge") >>>
[mcp_servers.forge]
# _managed_by = "nodeforge"
command = "/opt/node-v26.12.1-linux-x64/bin/node"
args = ["/home/data/sites/nodeforge/backend/src/transport/cli/index.js","mcp-serve","--project","/home/data/sites/nodeforge"]
enabled = true
startup_timeout_sec = 10
tool_timeout_sec = 120

[[hooks.PreToolUse]]
# _managed_by = "nodeforge"
matcher = "Read|Grep|Glob|Edit|Write|MultiEdit|NotebookEdit|apply_patch|read_file|list_dir|write_file|edit_file|Bash|shell|exec_command"
hooks = [{ type = "command", command = "'/opt/node-v26.12.1-linux-x64/bin/node' '/home/data/sites/nodeforge/backend/src/transport/cli/index.js' mcp pre-tool-hook --project '/home/data/sites/nodeforge'", _managed_by = "nodeforge" }]

[[hooks.SessionStart]]
# _managed_by = "nodeforge"
matcher = "compact|resume|.*"
hooks = [{ type = "command", command = "'/opt/node-v26.12.1-linux-x64/bin/node' '/home/data/sites/nodeforge/backend/src/transport/cli/index.js' mcp context-digest --project '/home/data/sites/nodeforge'", _managed_by = "nodeforge" }]
# <<< nodeforge-mcp-end <<<
